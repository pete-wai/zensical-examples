site_name = "Zensical Examples"
site_description = "See what Zensical 0.1.0 can do: working examples, native plugin demos, and release notes explained."
site_url = "https://pwai.dev/zensical-examples/"
repo_url = "https://github.com/pete-wai/zensical-examples"
repo_name = "pete-wai/zensical-examples"
edit_uri = "edit/main/docs/"
copyright = "An independent showcase · Built with Zensical 0.1.0 / UI 0.0.41"
extra_javascript = ["assets/javascripts/mathjax.js", "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"]

[project.theme]
variant = "modern"
features = ["navigation.tabs", "navigation.sections", "navigation.indexes", "navigation.path", "navigation.top", "navigation.footer", "content.code.copy", "content.code.annotate", "content.tabs.link", "content.tooltips", "content.footnote.tooltips", "content.action.view", "search.highlight", "search.suggest"]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "teal"
toggle = { icon = "lucide/moon", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "teal"
toggle = { icon = "lucide/sun", name = "Switch to light mode" }

[project.extra.status]
new = "New example"
deprecated = "Deprecated example"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
"pymdownx.details" = {}
"pymdownx.caret" = {}
"pymdownx.mark" = {}
"pymdownx.tilde" = {}
"pymdownx.keys" = {}
"pymdownx.inlinehilite" = {}
"pymdownx.snippets" = { base_path = ["docs"] }
"pymdownx.tasklist" = { custom_checkbox = true }
"pymdownx.tabbed" = { alternate_style = true }
"pymdownx.highlight" = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }
"pymdownx.emoji" = { emoji_index = "zensical.extensions.emoji.twemoji", emoji_generator = "zensical.extensions.emoji.to_svg" }
"pymdownx.arithmatex" = { generic = true }
"pymdownx.superfences" = { custom_fences = [{ name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }] }
"pymdownx.blocks.caption" = {}
"pymdownx.smartsymbols" = {}

[project.plugins.redirects.redirect_maps]
